name: notebooklmc

services:
  caddy:
    image: caddy:2
    container_name: notebook-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: ./apps/frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the JS bundle at build time by
        # Next.js, not read at container runtime - so this must be a build
        # arg, not an `environment:` entry. Rebuild the image after changing
        # NEXT_PUBLIC_API_URL in .env.
        #
        # Default empty = same-origin, relative API calls (e.g. "/api/notebooks")
        # that Caddy routes to the api service on the same origin as the
        # frontend (see infra/caddy/Caddyfile). Only set this to an absolute
        # URL if the API is served from a genuinely separate domain/subdomain.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: notebook-frontend
    restart: unless-stopped
    environment:
      # Runtime variable (not a build arg) for the route handler in
      # apps/frontend/app/api/[...path]/route.ts: the Next.js server proxies
      # relative "/api/*" calls to the api service itself, so port 3000 works
      # without Caddy.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    container_name: notebook-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./packages/prompts:/app/packages/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
    container_name: notebook-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./packages/prompts:/app/packages/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: notebook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notebook}
      POSTGRES_USER: ${POSTGRES_USER:-notebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notebook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notebook} -d ${POSTGRES_DB:-notebook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: notebook-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: notebook-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: notebook-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}
    volumes:
      - minio_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the notebook-files bucket on startup so no manual setup step is
  # needed.
  minio-init:
    image: minio/mc:latest
    container_name: notebook-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-notebook-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local $$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET || true &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      exit 0
      "
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
