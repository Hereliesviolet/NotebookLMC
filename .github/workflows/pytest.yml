name: pytest

# Baut die api- und worker-Images 1:1 wie in Produktion (docker-compose.yml)
# und fuehrt pytest darin aus, statt die Abhaengigkeiten auf dem bloßen
# Runner zu installieren - so sind Systembibliotheken wie libcairo2/pango
# (WeasyPrint/cairosvg, siehe apps/api/Dockerfile) automatisch vorhanden und
# es gibt keine Python-/Paketversions-Abweichung zum echten Deployment.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/pytest.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    # Die neuen Auth-Endpoint-Tests (tests/test_auth_endpoints.py, Block 7 der
    # Session-Auth-Migration) brauchen eine echte Postgres+Redis-Instanz -
    # kein Mocking bei echten Endpoint-Tests. Als Service-Container statt im
    # docker-run-Image selbst, damit sie unabhaengig vom api-Image-Build
    # bereitstehen.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notebook
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t notebooklmc-api-ci apps/api

      # LANGDOCK_PRIMARY_MODEL/LANGDOCK_FAST_MODEL muessen nur nicht-leer sein
      # (Tests mocken den eigentlichen Anthropic/OpenAI-Client) - kein echter
      # LANGDOCK_API_KEY notwendig, da keine reale Netzwerkanfrage erfolgt.
      #
      # --network host: die Service-Container obenstehend veroeffentlichen
      # ihre Ports auf dem Runner-Host (localhost:5432/6379) - das gebaute
      # api-Image laeuft hier bewusst NICHT im default Docker-Compose-Netzwerk
      # (das existiert in CI gar nicht), sondern direkt im Netzwerk-Namespace
      # des Runners, um diese Ports darüber zu erreichen.
      - name: Run alembic migrations against the test database
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=notebook \
            -e POSTGRES_USER=notebook \
            -e POSTGRES_PASSWORD=notebook \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-api-ci alembic upgrade head

      - name: Run api pytest suite
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=notebook \
            -e POSTGRES_USER=notebook \
            -e POSTGRES_PASSWORD=notebook \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-api-ci pytest tests -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -t notebooklmc-worker-ci apps/worker

      - name: Run worker pytest suite
        run: |
          docker run --rm \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-worker-ci pytest tests -q
