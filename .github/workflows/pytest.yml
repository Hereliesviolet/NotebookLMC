name: pytest

# Builds the api and worker images exactly as docker-compose.yml does and runs
# pytest inside them, instead of installing the dependencies on the bare
# runner. That way system libraries such as libcairo2/pango (WeasyPrint and
# cairosvg, see apps/api/Dockerfile) are present and there is no Python or
# package version drift against the real deployment.
# Lint and formatting checks live in lint.yml, frontend checks in frontend.yml.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/pytest.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    # The auth endpoint tests (tests/test_auth_endpoints.py) need a real
    # Postgres and Redis. They run as service containers rather than inside
    # the docker-run image so they are available independently of the api
    # image build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notebook
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t notebooklmc-api-ci apps/api

      # LANGDOCK_PRIMARY_MODEL and LANGDOCK_FAST_MODEL only have to be
      # non-empty: the tests mock the Anthropic/OpenAI clients, so no real
      # LANGDOCK_API_KEY is needed and no network request is made.
      #
      # --network host: the service containers above publish their ports on
      # the runner host (localhost:5432/6379). The freshly built api image
      # runs in the runner's network namespace to reach them, since there is
      # no docker compose network in CI.
      - name: Run alembic migrations against the test database
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=notebook \
            -e POSTGRES_USER=notebook \
            -e POSTGRES_PASSWORD=notebook \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-api-ci alembic upgrade head

      - name: Run api pytest suite
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=notebook \
            -e POSTGRES_USER=notebook \
            -e POSTGRES_PASSWORD=notebook \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-api-ci pytest tests -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -t notebooklmc-worker-ci apps/worker

      - name: Run worker pytest suite
        run: |
          docker run --rm \
            -e LANGDOCK_PRIMARY_MODEL=claude-sonnet-ci-dummy \
            -e LANGDOCK_FAST_MODEL=claude-haiku-ci-dummy \
            notebooklmc-worker-ci pytest tests -q
