name: lint

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: `ruff format` output can change between releases.
      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: ruff check
        run: |
          ruff check apps/api
          ruff check apps/worker

      - name: ruff format --check
        run: |
          ruff format --check apps/api
          ruff format --check apps/worker
