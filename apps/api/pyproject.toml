[project]
name = "notebooklmc-api"
version = "0.1.0"
description = "NotebookLM Clone - FastAPI backend (REST API, RAG orchestration, Langdock client)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped loop so tests share one event loop with the module-level
# async SQLAlchemy engine (app/db/session.py) - a per-test loop (the
# pytest-asyncio default) causes "attached to a different loop" errors on
# the second test that touches the DB, since asyncpg connections in the
# pool stay bound to whichever loop first opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
