[project]
name = "notebooklmc-api"
version = "0.1.0"
description = "NotebookLM Clone - FastAPI backend (REST API, RAG orchestration, Langdock client)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
