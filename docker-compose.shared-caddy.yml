name: notebooklmc

# -----------------------------------------------------------------------------
# Optional overlay for hosts where ports 80/443 are already taken by another
# reverse proxy (for example a Caddy container that serves several projects).
#
# Use it in addition to docker-compose.yml and do not start the project's own
# "caddy" service (see docs/deployment.md):
#
#   docker compose -f docker-compose.yml -f docker-compose.shared-caddy.yml \
#     up -d --no-deps api frontend
#
# "api" and "frontend" then also join the Docker network of the existing Caddy
# container and are reachable there as "api" and "frontend". The existing
# Caddyfile needs a site block for this project that routes /api/* to api:8000
# and everything else to frontend:3000 (see infra/caddy/Caddyfile).
#
# The external network name at the bottom (caddy_network) is a placeholder.
# Set it to the network the existing Caddy container is attached to:
#   docker inspect <caddy-container> --format '{{json .NetworkSettings.Networks}}'
# -----------------------------------------------------------------------------

services:
  api:
    # In the shared network, other projects' containers may register the same
    # short DNS aliases ("postgres", "minio", ...). A container in several
    # networks then does not reliably resolve those names to its own project,
    # and "postgres" can end up pointing at another project's database. The
    # container_name values are unique per host, so the dependencies are
    # addressed by those instead of by the generic service names.
    environment:
      POSTGRES_HOST: notebook-postgres
      REDIS_URL: redis://notebook-redis:6379/0
      QDRANT_URL: http://notebook-qdrant:6333
      MINIO_ENDPOINT: http://notebook-minio:9000
    networks:
      - default
      - shared_caddy_net

  frontend:
    # The Next.js standalone server binds to the address that HOSTNAME
    # resolves to inside the container. With a single network that is the only
    # container IP; with two networks it can be the one the shared Caddy
    # cannot reach. Bind to all interfaces explicitly.
    # INTERNAL_API_URL is not repeated here: compose merges the environment
    # mappings key by key, so the default from docker-compose.yml
    # (http://api:8000) still applies and stays valid, because "api" is also
    # attached to this project's default network.
    environment:
      HOSTNAME: "0.0.0.0"
    networks:
      - default
      - shared_caddy_net

networks:
  shared_caddy_net:
    external: true
    name: caddy_network
